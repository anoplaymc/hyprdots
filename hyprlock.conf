background {
    monitor =
    path = /home/anoplay/wallpaper.jpeg
    blur_passes = 2
    blur_size = 7
}

general {
    kb_layout = us
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    
    check_color = rgb(204, 136, 34)
    placeholder_text = ...
    
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Keyboard layout: $LAYOUT
    color = rgb(205, 214, 244)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}
